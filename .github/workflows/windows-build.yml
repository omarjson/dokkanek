name: windows-build
on:
  push:
    branches: ["**"]
    tags: ["windows-v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore
        run: nuget restore windows\src\Dokkanek.Desktop\Dokkanek.Desktop.csproj
      - name: Build Release
        run: msbuild windows\src\Dokkanek.Desktop\Dokkanek.Desktop.csproj /p:Configuration=Release /p:Platform="Any CPU" /m
      - name: Test
        run: |
          $sln = Get-ChildItem windows -Recurse -Filter *.sln | Select-Object -First 1
          $test = Get-ChildItem windows -Recurse -Filter *.Tests.csproj | Select-Object -First 1
          if ($test) {
            vstest.console.exe (Join-Path (Split-Path $test.FullName) "bin\Release\*.Tests.dll") | Out-Null
          } else {
            echo "no test project yet — skipping vstest (TODO)"
          }
      - name: Portable zip
        run: Compress-Archive -Path windows\src\Dokkanek.Desktop\bin\Release\net48\* -DestinationPath Dokkanek-portable.zip -Force
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: Dokkanek-portable.zip
      - name: Build installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\setup.iss
        continue-on-error: true
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows\installer\Output\*.exe
        continue-on-error: true

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Velopack release (TODO: wire velopack publish)
        run: echo "Velopack release on tag $env:GITHUB_REF_NAME — attach portable + installer from build job"
